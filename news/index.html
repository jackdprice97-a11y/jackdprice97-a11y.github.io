<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Front Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a newspaper front page. Stories several papers carry lead in a
   two-column block; everything else runs below as a dense single-file list. */
:root {
  --paper: #f6f7f4;
  --card: #ffffff;
  --ink: #15191c;
  --muted: #5b646b;
  --rule: #d5dad6;
  --accent: #0b5a6f;
  --accent-soft: #dcecef;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101416;
    --card: #181e21;
    --ink: #e9edea;
    --muted: #98a3a8;
    --rule: #2b3438;
    --accent: #7cc6d6;
    --accent-soft: #1d3339;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }

header.mast {
  padding: 20px 0 12px;
  border-bottom: 3px double var(--ink);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
}
.mast h1 {
  margin: 0; font: 700 clamp(34px, 9vw, 56px)/1 var(--display); letter-spacing: -0.02em;
}
.mast .date { color: var(--muted); font-size: 14px; margin-left: auto; text-align: right; }

.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--rule); }
.tab {
  font: 600 15px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 2px 11px; cursor: pointer;
}
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.controls { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.search {
  width: 100%; font: 400 16px var(--body); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px;
}
.search::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 13px/1 var(--body); padding: 8px 12px; border-radius: 999px;
  border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip.down { text-decoration: line-through; opacity: .6; }
.prefer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.prefer select {
  font: 500 13px var(--body); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
}

h2.section {
  font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); margin: 24px 0 4px;
}
.lead { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 32px; }
.story[hidden] { display: none; }
.story { padding: 16px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
.story h3 { margin: 0; font: 600 20px/1.22 var(--display); text-wrap: balance; }
.lead .story h3 { font-size: 24px; font-weight: 700; }
.lead ~ .lead .story h3 { font-size: 20px; font-weight: 600; }
.story h3 a { text-decoration: none; }
.story h3 a:hover { text-decoration: underline; text-decoration-thickness: 1px; }
.front {
  align-self: flex-start; font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--paper); background: var(--ink); padding: 5px 7px; border-radius: 3px;
}
.story p { margin: 0; color: var(--muted); font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.meta .when { margin-right: 4px; font-variant-numeric: tabular-nums; }
.copy {
  font: 600 12px/1 var(--body); text-decoration: none; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
}
.copy:hover { border-color: var(--accent); }
.copy.current { border-color: var(--accent); background: var(--accent-soft); }
dialog {
  width: min(560px, calc(100% - 24px)); border: 1px solid var(--rule); border-radius: 12px;
  background: var(--paper); color: var(--ink); padding: 16px;
}
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.panel-head h2 { margin: 0; }
.strap { margin: 14px 0 8px; font-family: var(--body); overflow-wrap: anywhere; }
.strap-top { background: var(--accent); color: var(--paper); font-weight: 600; font-size: 18px; line-height: 1.25; padding: 8px 10px; }
.strap-bottom { background: var(--ink); color: var(--paper); font-size: 15px; line-height: 1.3; padding: 8px 10px; }
.panel-headline { font: 600 19px/1.25 var(--display); margin: 10px 0; }
.copytext { font: 400 16px/1.55 var(--body); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 14px; margin-top: 10px; }
.copytext p { margin: 10px 0; color: var(--ink); }
.front[hidden], .copytext[hidden], .chip[hidden], .keyform[hidden], .linkish[hidden] { display: none; }
.keyform { font-size: 13px; color: var(--muted); margin-top: 10px; }
.keyform .search { flex: 1 1 180px; width: auto; }
.linkish { background: none; border: 0; padding: 8px 0 0; color: var(--muted); font: 400 12px var(--body); text-decoration: underline; cursor: pointer; }
.chip:disabled { opacity: .5; }
dialog { max-height: calc(100% - 24px); overflow-y: auto; }
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.counts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 14px; padding: 24px 0; }
footer { color: var(--muted); font-size: 13px; padding-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Front Pages</h1>
    <div class="date"><span id="today"></span><br><span id="updated">Loading…</span></div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" id="tab-news" type="button" aria-pressed="true">News</button>
    <button class="tab" id="tab-sport" type="button" aria-pressed="false">Sport</button>
  </nav>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search the past 36 hours" aria-label="Search stories from the past 36 hours" autocomplete="off">
    <div class="chips" id="chips" aria-label="Papers to show"></div>
    <label class="prefer" for="prefer">When several papers have a story, show
      <select id="prefer"></select>
    </label>
  </div>

  <main id="main"><p class="note">Loading today's headlines…</p></main>
  <footer id="footer"></footer>
</div>

<dialog id="panel" aria-labelledby="panel-title">
  <div class="panel-head">
    <h2 class="section" id="panel-title">Story</h2>
    <button class="chip" id="panel-close" type="button">Close</button>
  </div>
  <div class="front" id="panel-front" hidden></div>
  <p class="panel-headline" id="panel-headline"></p>
  <div class="meta" id="panel-papers"></div>

  <h2 class="section">Strapline</h2>
  <div class="strap">
    <div class="strap-top" id="strap-top"></div>
    <div class="strap-bottom" id="strap-bottom"></div>
  </div>
  <div class="counts" id="strap-counts"></div>
  <div class="panel-actions">
    <button class="chip" id="strap-copy" type="button">Copy strapline</button>
    <button class="chip" id="strap-caps" type="button" aria-pressed="true">Capitals</button>
    <button class="chip" id="strap-write" type="button">Rewrite strapline</button>
  </div>
  <div class="counts" id="strap-note"></div>

  <h2 class="section">Copy</h2>
  <div class="copytext" id="copy-text" hidden></div>
  <div class="counts" id="copy-counts"></div>
  <div class="panel-actions">
    <button class="chip" id="copy-write" type="button">Write copy</button>
    <button class="chip" id="copy-copy" type="button" hidden>Copy text</button>
  </div>
  <div class="counts">Rewrite strapline and Write copy use your API credits each time. Check copy against the sources before using it.</div>

  <div class="counts" id="made-status" role="status"></div>
  <form class="keyform" id="keyform" hidden>
    <label for="key-input">Paste your Claude API key to write on request. It is saved only in this browser.</label>
    <div class="panel-actions">
      <input class="search" id="key-input" type="password" autocomplete="off" placeholder="sk-ant-…">
      <button class="chip" type="submit">Save key</button>
    </div>
  </form>
  <button class="linkish" id="key-forget" type="button" hidden>Remove the saved key from this browser</button>
</dialog>

<script>
(function () {
  var state = { data: null, off: {}, prefer: "", caps: true, open: null };
  try {
    state.caps = localStorage.getItem("news.caps") !== "off";
    state.off = JSON.parse(localStorage.getItem("news.off") || "{}");
    state.prefer = localStorage.getItem("news.prefer") || "";
  } catch (e) {}
  function save() {
    try {
      localStorage.setItem("news.off", JSON.stringify(state.off));
      localStorage.setItem("news.prefer", state.prefer);
      localStorage.setItem("news.caps", state.caps ? "on" : "off");
    } catch (e) {}
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function ago(iso) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 60) return mins + " min ago";
    var hours = Math.round(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? " hour ago" : " hours ago");
    return "yesterday";
  }

  function renderControls() {
    var names = {};
    var chips = document.getElementById("chips");
    var select = document.getElementById("prefer");
    chips.textContent = "";
    select.textContent = "";
    var first = el("option", null, "whichever is first");
    first.value = "";
    select.appendChild(first);
    state.data.sources.forEach(function (source) {
      names[source.id] = source.name;
      var chip = el("button", "chip" + (source.ok ? "" : " down"), source.name);
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(!state.off[source.id]));
      chip.title = source.ok ? source.count + " stories" : "Could not be reached this hour";
      chip.addEventListener("click", function () {
        if (state.off[source.id]) delete state.off[source.id]; else state.off[source.id] = true;
        save(); renderControls(); renderStories();
      });
      chips.appendChild(chip);
      var option = el("option", null, source.name);
      option.value = source.id;
      select.appendChild(option);
    });
    select.value = state.prefer;
    select.onchange = function () { state.prefer = select.value; save(); renderStories(); };
    state.names = names;
  }

  // e.g. "Tuesday's front pages: Mail, Times", from the day the papers review came out
  function frontLabel(story) {
    var date = state.data.front && state.data.front.date ? new Date(state.data.front.date) : null;
    var day = date && !isNaN(date) ? date.toLocaleDateString("en-GB", { weekday: "long" }) + "'s front" : "Front";
    return day + (story.front.length > 1 ? " pages: " : " page: ") + story.front.join(", ");
  }
  function storyNode(story) {
    var versions = story.versions.filter(function (v) { return !state.off[v.s]; });
    if (!versions.length) return null;
    var shown = versions.filter(function (v) { return v.s === state.prefer; })[0] || versions[0];
    var node = el("article", "story");
    var heading = el("h3");
    var link = el("a", null, shown.t);
    link.href = shown.u; link.target = "_blank"; link.rel = "noopener";
    link.addEventListener("click", function (event) {
      if (!story.strap || !panel.showModal) return; // no strap: open the article as before
      event.preventDefault();
      openPanel(story, versions);
    });
    heading.appendChild(link);
    node.appendChild(heading);
    if (story.front) node.insertBefore(el("div", "front", frontLabel(story)), heading);
    if (shown.d) node.appendChild(el("p", null, shown.d));
    var meta = el("div", "meta");
    meta.appendChild(el("span", "when", ago(story.time)));
    versions.forEach(function (v) {
      var copy = el("a", "copy" + (v === shown ? " current" : ""), state.names[v.s] || v.s);
      copy.href = v.u; copy.target = "_blank"; copy.rel = "noopener";
      copy.title = v.t;
      meta.appendChild(copy);
    });
    node.appendChild(meta);
    node.dataset.papers = versions.length;
    return node;
  }

  /*WRITE-START*/
  var LIMIT = { top: 43, bottom: 75 };
  var WRITER = "claude-opus-5-5";
  function houseStyle(text) {
    text = String(text || "").replace(/\s+/g, " ").trim().replace(/\bUS\b(?!\.)/g, "U.S.");
    text = text.replace(/^(?:The|A|An) (?=\S)/, "");  // headline style: no article to open a line
    text = text.charAt(0).toUpperCase() + text.slice(1);
    return /\.$/.test(text) && !/U\.S\.$/.test(text) ? text.slice(0, -1) : text;
  }
  function trimLine(text, limit) {
    text = text.replace(/;/g, ",");
    if (text.length <= limit) return text;
    var cut = text.slice(0, limit + 1);
    cut = cut.slice(0, cut.lastIndexOf(" ")).slice(0, limit);
    return cut.replace(/[ ,;:\-–—'‘"]+$/, "");
  }
  function needsFix(strap) {
    return strap.top.length > LIMIT.top || strap.bottom.length > LIMIT.bottom || /;/.test(strap.top + strap.bottom);
  }
  async function askWriter(key, prompt, maxTokens) {
    var response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: WRITER,
        max_tokens: maxTokens,
        thinking: { type: "adaptive" },
        output_config: { effort: "low" },
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!response.ok) {
      var detail = "";
      try { detail = (await response.json()).error.message; } catch (e) {}
      var error = new Error(detail || "Request failed (" + response.status + ")");
      error.status = response.status;
      throw error;
    }
    var reply = await response.json();
    var text = (reply.content || []).map(function (block) { return block.text || ""; }).join("").trim();
    if (!text) throw new Error("The reply was empty. Try again.");
    return text;
  }
  function readStrap(text) {
    var found = text.match(/\{[^{}]*\}/);
    if (!found) throw new Error("The reply could not be read. Try again.");
    var parsed = JSON.parse(found[0]);
    var strap = { top: houseStyle(parsed.top), bottom: houseStyle(parsed.bottom) };
    if (!strap.top || !strap.bottom) throw new Error("The reply was incomplete. Try again.");
    return strap;
  }
  function sourceText(versions, names) {
    return versions.map(function (v) {
      return (names[v.s] || v.s) + "\nHeadline: " + v.t + "\n" + (v.x || v.d || "");
    }).join("\n\n");
  }
  // brief: the same strapline brief the hourly collection uses
  async function writeStrap(key, brief, versions, previous) {
    var summary = "";
    versions.forEach(function (v) { if (!summary && (v.x || v.d)) summary = v.x || v.d; });
    var story = "0. HEADLINES: " + versions.slice(0, 4).map(function (v) { return v.t; }).join(" | ") + "\n   SUMMARY: " + summary;
    var prompt = brief.replace("{stories}", story) +
      (previous ? "\n\nWrite a clearly different version from this earlier one:\n" + previous.top + "\n" + previous.bottom : "");
    var strap = readStrap(await askWriter(key, prompt, 6000));
    for (var round = 0; round < 2 && needsFix(strap); round++) {
      strap = readStrap(await askWriter(key,
        "This TV news strapline breaks house rules (too long, or it uses a semicolon). Rewrite it so that top is at most " +
        (LIMIT.top - 2) + " characters and bottom is at most " + (LIMIT.bottom - 3) + " characters, counting spaces. " +
        "Cut words or rephrase. Use no semicolons, no pronoun for the subject, no \"The\", \"A\" or \"An\" to open a line, keep the present tense, the facts and the " +
        "attribution of anything alleged, and keep the two lines from repeating each other.\n\n" +
        "top (" + strap.top.length + " characters): " + strap.top + "\n" +
        "bottom (" + strap.bottom.length + " characters): " + strap.bottom + "\n\n" +
        'Reply with only JSON: {"top": "...", "bottom": "..."}', 6000));
    }
    return { top: trimLine(strap.top, LIMIT.top), bottom: trimLine(strap.bottom, LIMIT.bottom) };
  }
  async function writeCopy(key, versions, names) {
    var prompt =
      "You are a writer on a British TV news channel. Write original news copy on the story below, " +
      "based only on the source material from other outlets that follows.\n\n" +
      "Rules:\n" +
      "- Around two paragraphs, 110 to 150 words in all, if the sources hold enough facts. If they do not, write less. Never pad.\n" +
      "- Entirely your own wording and structure. Do not reuse any outlet's sentences or distinctive phrases. Names, titles, places and figures are fine, and so is a short direct quote if it is attributed to the person who said it.\n" +
      "- Use only facts stated in the sources. Add no background, context, figures or history from memory. If the outlets disagree, say who reports what.\n" +
      "- Attribute anything alleged, claimed or unproven, and never state an allegation as fact. Do not call anyone a victim or offender unless a court has found it.\n" +
      "- Open with a present-tense sentence that tells the story. Short, clear sentences that read well aloud. British spelling. Write the United States as U.S.\n" +
      "- Never mention \"the sources\" or comment on what is missing or unknown. Leave out anything you cannot state.\n" +
      "- Plain text only: no headline, no bullet points, no notes before or after. Separate the paragraphs with a blank line.\n\n" +
      "SOURCES\n\n" + sourceText(versions, names);
    var text = await askWriter(key, prompt, 8000);
    return text.replace(/\r/g, "").replace(/\bUS\b(?!\.)/g, "U.S.").replace(/\n{3,}/g, "\n\n").trim();
  }
  /*WRITE-END*/

  var panel = document.getElementById("panel");
  var $ = function (id) { return document.getElementById(id); };
  var made = {};  // straps and copy written on request, kept in this browser
  try { made = JSON.parse(localStorage.getItem("news.made") || "{}"); } catch (e) {}
  function getKey() { try { return localStorage.getItem("news.key") || ""; } catch (e) { return ""; } }
  function storyKey(story) { return story.versions[0].u; }
  function keep(story, field, value) {
    var key = storyKey(story);
    made[key] = made[key] || {};
    made[key][field] = value;
    var keys = Object.keys(made);
    if (keys.length > 150) delete made[keys[0]];
    try { localStorage.setItem("news.made", JSON.stringify(made)); } catch (e) {}
  }
  function mine(story) { return made[storyKey(story)] || {}; }
  function currentStrap() { return mine(state.open).strap || state.open.strap; }
  function strapLines() {
    var strap = currentStrap();
    return state.caps ? [strap.top.toUpperCase(), strap.bottom.toUpperCase()] : [strap.top, strap.bottom];
  }
  function renderPanel() {
    var lines = strapLines(), copy = mine(state.open).copy;
    $("strap-top").textContent = lines[0];
    $("strap-bottom").textContent = lines[1];
    $("strap-counts").textContent =
      "Top " + lines[0].length + " of " + LIMIT.top + " characters, bottom " + lines[1].length + " of " + LIMIT.bottom;
    $("strap-caps").setAttribute("aria-pressed", String(state.caps));
    $("strap-note").textContent = currentStrap().auto
      ? "Rough version, trimmed from the headline. A written one replaces it at the next update."
      : "";
    $("strap-copy").textContent = "Copy strapline";
    $("copy-copy").textContent = "Copy text";
    $("copy-text").hidden = !copy;
    $("copy-copy").hidden = !copy;
    $("copy-write").textContent = copy ? "Write copy again" : "Write copy";
    $("copy-text").textContent = "";
    $("copy-counts").textContent = "";
    if (copy) {
      copy.split(/\n\s*\n/).forEach(function (para) { $("copy-text").appendChild(el("p", null, para)); });
      $("copy-counts").textContent = copy.split(/\s+/).filter(Boolean).length + " words";
    }
    $("key-forget").hidden = !getKey();
  }
  function openPanel(story, versions) {
    state.open = story;
    $("panel-headline").textContent = versions[0].t;
    $("panel-front").textContent = story.front ? frontLabel(story) : "";
    $("panel-front").hidden = !story.front;
    $("made-status").textContent = "";
    $("keyform").hidden = true;
    var papers = $("panel-papers");
    papers.textContent = "";
    versions.forEach(function (v) {
      var link = el("a", "copy", "Read in " + (state.names[v.s] || v.s));
      link.href = v.u; link.target = "_blank"; link.rel = "noopener"; link.title = v.t;
      papers.appendChild(link);
    });
    renderPanel();
    panel.showModal();
  }
  function copyOut(button, text) {
    function done(ok) { button.textContent = ok ? "Copied" : "Could not copy: select the text instead"; }
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); }
    catch (e) { done(false); }
  }
  // run a paid request for the open story, with the key and error handling in one place
  function request(button, label, work) {
    var key = getKey(), story = state.open;
    if (!key) { state.pending = button; $("keyform").hidden = false; $("key-input").focus(); return; }
    button.disabled = true;
    $("made-status").textContent = label;
    work(key, story).then(function () {
      if (state.open === story) { $("made-status").textContent = ""; renderPanel(); }
    }, function (error) {
      if (state.open !== story) return;
      $("made-status").textContent = error.status === 401
        ? "The key was rejected. Remove it below and save it again."
        : "Could not finish: " + (error.message === "Failed to fetch" || error.message === "Load failed"
          ? "no connection to the writing service from here. Open the page in a web browser."
          : error.message);
    }).then(function () { button.disabled = false; });
  }
  $("panel-close").addEventListener("click", function () { panel.close(); });
  panel.addEventListener("click", function (event) { if (event.target === panel) panel.close(); });
  $("strap-caps").addEventListener("click", function () { state.caps = !state.caps; save(); renderPanel(); });
  $("strap-copy").addEventListener("click", function () { copyOut(this, strapLines().join("\n")); });
  $("copy-copy").addEventListener("click", function () { copyOut(this, mine(state.open).copy); });
  $("strap-write").addEventListener("click", function () {
    request(this, "Writing a new strapline…", function (key, story) {
      return writeStrap(key, state.data.brief, story.versions, mine(story).strap || (story.strap.auto ? null : story.strap))
        .then(function (strap) { keep(story, "strap", strap); });
    });
  });
  $("copy-write").addEventListener("click", function () {
    request(this, "Writing copy…", function (key, story) {
      return writeCopy(key, story.versions, state.names).then(function (text) { keep(story, "copy", text); });
    });
  });
  $("keyform").addEventListener("submit", function (event) {
    event.preventDefault();
    var value = $("key-input").value.trim();
    if (!value) return;
    try { localStorage.setItem("news.key", value); }
    catch (e) { $("made-status").textContent = "This browser would not save the key."; return; }
    $("key-input").value = "";
    $("keyform").hidden = true;
    renderPanel();
    if (state.pending) { var button = state.pending; state.pending = null; button.click(); }
  });
  $("key-forget").addEventListener("click", function () {
    try { localStorage.removeItem("news.key"); } catch (e) {}
    $("made-status").textContent = "Key removed from this browser.";
    renderPanel();
  });

  function renderStories() {
    var main = document.getElementById("main");
    main.textContent = "";
    var terms = (state.query || "").toLowerCase().split(/\s+/).filter(Boolean);
    if (terms.length) {
      var found = el("div");
      state.data.stories.filter(function (story) {
        var text = story.versions.filter(function (v) { return !state.off[v.s]; })
          .map(function (v) { return v.t + " " + v.d; }).join(" ").toLowerCase();
        return terms.every(function (term) { return text.indexOf(term) !== -1; });
      }).sort(function (a, b) { return a.time < b.time ? 1 : -1; })
        .forEach(function (story) { var node = storyNode(story); if (node) found.appendChild(node); });
      var count = found.children.length;
      main.appendChild(el("h2", "section", count + (count === 1 ? " story" : " stories") + " in the past 36 hours"));
      if (count) main.appendChild(found);
      else main.appendChild(el("p", "note", "Nothing matches. Try fewer or different words."));
      return;
    }
    var onSport = state.tab === "sport";
    var lead = el("div", "lead"), light = el("div", "lead"), rest = el("div");
    state.data.stories.forEach(function (story) {
      if (!!story.sport !== onSport) return;
      var node = storyNode(story);
      if (!node) return;
      if (story.light && !onSport) { if (light.children.length < 8) light.appendChild(node); }
      else if (story.front) lead.insertBefore(node, lead.querySelector(".story:not(.onfront)")), node.classList.add("onfront");
      else (Number(node.dataset.papers) > 1 ? lead : rest).appendChild(node);
    });
    if (lead.children.length) {
      main.appendChild(el("h2", "section", onSport ? "Main sport stories" : "Main stories"));
      main.appendChild(lead);
    }
    if (light.children.length) {
      main.appendChild(el("h2", "section", "Lighter side"));
      main.appendChild(light);
    }
    if (rest.children.length) {
      main.appendChild(el("h2", "section", onSport ? "More sport" : lead.children.length ? "Also today" : "Today"));
      main.appendChild(rest);
      var extra = Array.prototype.slice.call(rest.children, 25);
      if (extra.length && !state.showAll) {
        extra.forEach(function (node) { node.hidden = true; });
        var more = el("button", "chip", "Show " + extra.length + " more stories");
        more.type = "button";
        more.style.marginTop = "16px";
        more.addEventListener("click", function () { state.showAll = true; renderStories(); });
        main.appendChild(more);
      }
    }
    if (!lead.children.length && !rest.children.length && !light.children.length) {
      main.appendChild(el("p", "note", "No stories to show. Turn a paper back on above."));
    }
  }

  function render(data) {
    // single-paper stories: newest first
    var multi = data.stories.filter(function (s) { return s.versions.length > 1; });
    var single = data.stories.filter(function (s) { return s.versions.length < 2; })
      .sort(function (a, b) { return a.time < b.time ? 1 : -1; });
    data.stories = multi.concat(single);
    state.data = data;
    document.getElementById("updated").textContent = "Updated " + ago(data.updated);
    renderControls();
    renderStories();
    var down = data.sources.filter(function (s) { return !s.ok; }).map(function (s) { return s.name; });
    document.getElementById("footer").textContent =
      (down.length ? "Could not reach this hour: " + down.join(", ") + ". " : "") +
      "Headlines and summaries belong to each paper. Tap a paper's name to read its version on its own site.";
  }

  function showTab(tab) {
    state.tab = tab;
    state.showAll = false;
    document.getElementById("tab-news").setAttribute("aria-pressed", String(tab !== "sport"));
    document.getElementById("tab-sport").setAttribute("aria-pressed", String(tab === "sport"));
    if (location.hash !== (tab === "sport" ? "#sport" : "")) {
      try { history.replaceState(null, "", tab === "sport" ? "#sport" : location.pathname); } catch (e) {}
    }
    if (state.data) renderStories();
  }
  document.getElementById("tab-news").addEventListener("click", function () { showTab("news"); });
  document.getElementById("tab-sport").addEventListener("click", function () { showTab("sport"); });
  if (location.hash === "#sport") showTab("sport");

  document.getElementById("search").addEventListener("input", function (event) {
    state.query = event.target.value;
    if (state.data) renderStories();
  });

  document.getElementById("today").textContent = new Date().toLocaleDateString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  fetch("data.json?" + Date.now(), { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error(response.status);
      return response.json();
    })
    .then(render)
    .catch(function () {
      document.getElementById("updated").textContent = "";
      document.getElementById("main").innerHTML =
        '<p class="note">No headlines yet. The first collection runs within the hour after this page goes live. Reload then.</p>';
    });
})();
</script>
</body>
</html>
