name: Update news headlines

on:
  schedule:
    - cron: "7,37 * * * *" # twice an hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news/fetch.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: python3 news/fetch.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publish if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news/data.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update news headlines"
            git pull --rebase
            git push
          fi
